# ============================================================
# docker-compose.yml — DevConnect full stack
# ============================================================

version: '3.9'

services:
  # ---- MongoDB ----
  mongo:
    image: mongo:7
    container_name: devconnect_mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: devconnect
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---- Backend API ----
  backend:
    build:
      context: ./backend
      target: production
    container_name: devconnect_api
    restart: unless-stopped
    ports:
      - '5000:5000'
    env_file: ./backend/.env
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/devconnect
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:5000/health']
      interval: 30s
      timeout: 10s
      retries: 3

  # ---- Frontend (served by nginx) ----
  frontend:
    build:
      context: ./frontend
      target: production
      args:
        VITE_API_URL: /api/v1
        VITE_SOCKET_URL: ''
    container_name: devconnect_web
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo_data:
    driver: local
